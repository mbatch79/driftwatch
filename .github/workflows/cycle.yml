# The swarm's heartbeat. Runs one Driftwatch cycle a week on GitHub's free runners,
# commits the brief + feed + ledger back, and opens an issue if VAULT leaves NORMAL.
# No server, no babysitter. Manual trigger available for an out-of-band cycle.
name: driftwatch-cycle
on:
  schedule:
    - cron: "17 21 * * 0"   # Sunday 21:17 UTC = Monday 08:17 AEDT, before Melbourne's work day
  workflow_dispatch:
    inputs:
      window_days:
        description: "Fallback window for sources with no watermark"
        default: "60"
permissions:
  contents: write
  issues: write
concurrency: { group: cycle, cancel-in-progress: false }
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyyaml
      - name: VAULT lock check
        run: python -m driftwatch budget   # refuses if vault.yaml was edited without re-locking
      - name: Run cycle
        id: run
        run: |
          python -m driftwatch cycle "${{ github.event.inputs.window_days || '60' }}" | tee cycle.log
          echo "mode=$(grep -oP 'mode \K\w+' cycle.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "cycle=$(ls briefs/cycle-*.md | grep -oP 'cycle-\K\d+' | sort -n | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Commit brief, feed, ledger
        run: |
          git config user.name "driftwatch-marrow"
          git config user.email "marrow@users.noreply.github.com"
          git add briefs feed ledger
          git commit -m "Cycle ${{ steps.run.outputs.cycle }} · mode ${{ steps.run.outputs.mode }}" || echo "nothing to commit"
          git push
      - name: Publish brief to job summary
        run: cat "briefs/cycle-${{ steps.run.outputs.cycle }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Raise alarm if VAULT left NORMAL
        if: steps.run.outputs.mode != 'NORMAL'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `VAULT: cycle ${{ steps.run.outputs.cycle }} ended in ${{ steps.run.outputs.mode }}`,
              body: `See briefs/cycle-${{ steps.run.outputs.cycle }}.md and ledger/compute.jsonl. Human review required before the next cycle advances watermarks.`,
              labels: ['vault'] });
